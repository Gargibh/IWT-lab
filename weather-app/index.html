<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Weather App</h1>

    <!-- Search area: input + button (a <form> lets the Enter key work too) -->
    <form id="search-form" class="search" novalidate>
      <label for="city-input" class="visually-hidden">City name</label>
      <input type="text" id="city-input" placeholder="Enter a city, e.g. Chennai" autocomplete="off">
      <button type="submit" id="search-button">Get Weather</button>
    </form>

    <!-- Status message: used for "Loading..." and for error messages -->
    <p id="message" class="message" role="status" aria-live="polite"></p>

    <!-- Weather display: hidden until we have fresh data -->
    <section id="weather" class="weather" hidden>
      <h2 id="location"></h2>
      <p class="temperature"><span id="temperature"></span></p>
      <p id="condition" class="condition"></p>

      <dl class="details">
        <div><dt>Feels like</dt><dd id="feels-like"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind speed</dt><dd id="wind"></dd></div>
        <div><dt>Precipitation</dt><dd id="precipitation"></dd></div>
        <div><dt>Time of day</dt><dd id="day-night"></dd></div>
      </dl>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
