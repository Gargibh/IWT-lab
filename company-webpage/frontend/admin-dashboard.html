<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Meridian Corp</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="dash-topbar">
  <div class="brand"><span class="mark"></span> Meridian Corp Admin</div>
  <div class="user-info">
    <span id="userGreeting">Loading...</span>
    <button class="btn btn-secondary" id="logoutBtn">Log Out</button>
  </div>
</div>

<div class="dash-container">
  <div class="welcome-block">
    <h1>Admin Dashboard</h1>
    <p>Manage all employee records at Meridian Corp.</p>
  </div>

  <div id="pageMessage" class="form-message" style="display:none;"></div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Employees</div>
      <div class="stat-value" id="statTotal">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Departments</div>
      <div class="stat-value" id="statDepartments">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">New (Last 30 Days)</div>
      <div class="stat-value" id="statRecent">-</div>
    </div>
  </div>

  <div class="dash-card">
    <h2>Employee Records</h2>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search by name, employee ID, or department...">
      <button class="btn btn-primary" id="searchBtn">Search</button>
    </div>

    <div class="table-scroll">
      <div id="tableContainer">
        <p class="no-records">Loading employees...</p>
      </div>
    </div>
  </div>
</div>

<!-- View/Edit Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h2 id="modalTitle">Employee Details</h2>

    <div id="modalMessage" class="form-message" style="display:none;"></div>

    <form id="editForm">
      <input type="hidden" id="edit_id">
      <div class="form-grid-2">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="edit_full_name" name="full_name" required>
        </div>
        <div class="form-group">
          <label>Employee ID</label>
          <input type="text" id="edit_employee_id" disabled>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="text" id="edit_email" disabled>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="edit_phone" name="phone">
        </div>
        <div class="form-group">
          <label>Department</label>
          <select id="edit_department" name="department">
            <option value="Human Resources">Human Resources</option>
            <option value="Finance">Finance</option>
            <option value="Engineering">Engineering</option>
            <option value="Sales">Sales</option>
            <option value="Marketing">Marketing</option>
            <option value="Operations">Operations</option>
          </select>
        </div>
        <div class="form-group">
          <label>Designation</label>
          <input type="text" id="edit_designation" name="designation">
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select id="edit_gender" name="gender">
            <option value="">-- Select --</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" id="edit_dob" name="dob">
        </div>
        <div class="form-group">
          <label>City</label>
          <input type="text" id="edit_city" name="city">
        </div>
        <div class="form-group">
          <label>State</label>
          <input type="text" id="edit_state" name="state">
        </div>
        <div class="form-group">
          <label>Joining Date</label>
          <input type="date" id="edit_joining_date" name="joining_date">
        </div>
        <div class="form-group">
          <label>Emergency Contact</label>
          <input type="tel" id="edit_emergency_contact" name="emergency_contact">
        </div>
        <div class="form-group full-width">
          <label>Address</label>
          <textarea id="edit_address" name="address" rows="2"></textarea>
        </div>
        <div class="form-group full-width">
          <label>Skills</label>
          <textarea id="edit_skills" name="skills" rows="2"></textarea>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="closeModalBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
