<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Details Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-wrapper">
  <div class="form-card">

    <div class="form-header">
      <h1>Employee Details Form</h1>
      <p>Fill in the details below to add a new employee record</p>
    </div>

    <div class="top-link">
      <a href="employees.html">View All Employees &rarr;</a>
    </div>

    <div id="formMessage" class="form-message" style="display:none;"></div>

    <form id="employeeForm" novalidate>

      <div class="form-group">
        <label for="employee_id">Employee ID <span class="required">*</span></label>
        <input type="number" id="employee_id" name="employee_id" min="1" placeholder="e.g. 1001" required>
        <span class="error-message" id="err-employee_id"></span>
      </div>

      <div class="form-group">
        <label for="employee_name">Employee Name <span class="required">*</span></label>
        <input type="text" id="employee_name" name="employee_name" placeholder="Full name" required>
        <span class="error-message" id="err-employee_name"></span>
      </div>

      <div class="form-group">
        <label for="email">Email <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>
        <span class="error-message" id="err-email"></span>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number <span class="required">*</span></label>
        <input type="tel" id="phone" name="phone" placeholder="10-digit number" required>
        <span class="error-message" id="err-phone"></span>
      </div>

      <div class="form-group">
        <label>Gender <span class="required">*</span></label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="gender" value="Male" required> Male</label>
          <label class="radio-label"><input type="radio" name="gender" value="Female"> Female</label>
          <label class="radio-label"><input type="radio" name="gender" value="Other"> Other</label>
        </div>
        <span class="error-message" id="err-gender"></span>
      </div>

      <div class="form-group">
        <label for="date_of_birth">Date of Birth <span class="required">*</span></label>
        <input type="date" id="date_of_birth" name="date_of_birth" required>
        <span class="error-message" id="err-date_of_birth"></span>
      </div>

      <div class="form-group">
        <label for="department">Department <span class="required">*</span></label>
        <select id="department" name="department" required>
          <option value="">-- Select Department --</option>
          <option value="Human Resources">Human Resources</option>
          <option value="Finance">Finance</option>
          <option value="Engineering">Engineering</option>
          <option value="Sales">Sales</option>
          <option value="Marketing">Marketing</option>
          <option value="Operations">Operations</option>
        </select>
        <span class="error-message" id="err-department"></span>
      </div>

      <div class="form-group">
        <label for="designation">Designation <span class="required">*</span></label>
        <input type="text" id="designation" name="designation" placeholder="e.g. Software Engineer" required>
        <span class="error-message" id="err-designation"></span>
      </div>

      <div class="form-group">
        <label for="salary">Salary (per month) <span class="required">*</span></label>
        <input type="number" id="salary" name="salary" min="0" step="0.01" placeholder="e.g. 45000" required>
        <span class="error-message" id="err-salary"></span>
      </div>

      <div class="form-group">
        <label for="date_of_joining">Date of Joining <span class="required">*</span></label>
        <input type="date" id="date_of_joining" name="date_of_joining" required>
        <span class="error-message" id="err-date_of_joining"></span>
      </div>

      <div class="form-group full-width">
        <label for="address">Address</label>
        <textarea id="address" name="address" rows="3" placeholder="Street, City, State, PIN code"></textarea>
        <span class="error-message" id="err-address"></span>
      </div>

      <div class="form-actions">
        <button type="reset" class="btn btn-secondary" id="resetBtn">Clear</button>
        <button type="submit" class="btn btn-primary" id="submitBtn">Submit</button>
      </div>

    </form>
  </div>
</div>

<script src="validation.js"></script>
<script src="add-employee.js"></script>
</body>
</html>
