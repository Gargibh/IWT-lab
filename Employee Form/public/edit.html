<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Employee</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-wrapper">
  <div class="form-card">

    <div class="form-header">
      <h1>Edit Employee</h1>
      <p>Update the details below and save changes</p>
    </div>

    <div class="top-link">
      <a href="employees.html">&larr; Back to All Employees</a>
    </div>

    <div id="formMessage" class="form-message" style="display:none;"></div>

    <form id="editForm" novalidate>
      <input type="hidden" id="employee_id" name="employee_id">

      <div class="form-group">
        <label>Employee ID</label>
        <input type="text" id="employee_id_display" disabled>
      </div>

      <div class="form-group">
        <label for="employee_name">Employee Name <span class="required">*</span></label>
        <input type="text" id="employee_name" name="employee_name" required>
        <span class="error-message" id="err-employee_name"></span>
      </div>

      <div class="form-group">
        <label for="email">Email <span class="required">*</span></label>
        <input type="email" id="email" name="email" required>
        <span class="error-message" id="err-email"></span>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number <span class="required">*</span></label>
        <input type="tel" id="phone" name="phone" required>
        <span class="error-message" id="err-phone"></span>
      </div>

      <div class="form-group">
        <label>Gender <span class="required">*</span></label>
        <div class="radio-group" id="genderGroup">
          <label class="radio-label"><input type="radio" name="gender" value="Male"> Male</label>
          <label class="radio-label"><input type="radio" name="gender" value="Female"> Female</label>
          <label class="radio-label"><input type="radio" name="gender" value="Other"> Other</label>
        </div>
        <span class="error-message" id="err-gender"></span>
      </div>

      <div class="form-group">
        <label for="date_of_birth">Date of Birth</label>
        <input type="date" id="date_of_birth" name="date_of_birth">
      </div>

      <div class="form-group">
        <label for="department">Department <span class="required">*</span></label>
        <select id="department" name="department" required>
          <option value="">-- Select Department --</option>
          <option value="Human Resources">Human Resources</option>
          <option value="Finance">Finance</option>
          <option value="Engineering">Engineering</option>
          <option value="Sales">Sales</option>
          <option value="Marketing">Marketing</option>
          <option value="Operations">Operations</option>
        </select>
        <span class="error-message" id="err-department"></span>
      </div>

      <div class="form-group">
        <label for="designation">Designation <span class="required">*</span></label>
        <input type="text" id="designation" name="designation" required>
        <span class="error-message" id="err-designation"></span>
      </div>

      <div class="form-group">
        <label for="salary">Salary <span class="required">*</span></label>
        <input type="number" id="salary" name="salary" min="0" step="0.01" required>
        <span class="error-message" id="err-salary"></span>
      </div>

      <div class="form-group">
        <label for="date_of_joining">Date of Joining <span class="required">*</span></label>
        <input type="date" id="date_of_joining" name="date_of_joining" required>
        <span class="error-message" id="err-date_of_joining"></span>
      </div>

      <div class="form-group full-width">
        <label for="address">Address</label>
        <textarea id="address" name="address" rows="3"></textarea>
      </div>

      <div class="form-actions">
        <a href="employees.html" class="btn btn-secondary" style="text-decoration:none; text-align:center;">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>

  </div>
</div>

<script src="validation.js"></script>
<script src="edit-employee.js"></script>
</body>
</html>
